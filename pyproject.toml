[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bist-airlines-analytics"
version = "0.1.0"
description = "Reproducible THYAO research with causal analysis, backtesting and MCP tools"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pandas>=2.2,<4", "numpy>=2,<3", "yfinance>=0.2.65,<2",
  "matplotlib>=3.9,<4", "pyarrow>=18", "pydantic>=2.9,<3",
  "PyYAML>=6,<7", "mcp>=2.2,<3", "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5", "lxml>=5", "pypdf>=5", "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "uv>=0.8"]

[project.scripts]
bist = "bist_analytics.cli:main"
bist-mcp = "bist_analytics.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bist_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
